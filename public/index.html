<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<title>Zia</title>
<script>
  // apply the saved appearance before first paint (default: light)
  try { document.documentElement.dataset.theme = (JSON.parse(localStorage.getItem("krefter_settings") || "{}").theme) || "light"; }
  catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2318181b'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f8; --bg2: #ffffff; --surface-solid: #ffffff; --elev: #f4f4f5;
    --line: #e9e9ec; --line2: #d8d8dd;
    --ink: #18181b; --ink2: #52525b; --ink3: #8b8b93;
    --student: #3366d6; --founder: #d9622b;
    --danger: #d92d20; --warn: #c77700; --ok: #16a34a;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 12px 32px rgba(16,24,40,.10);
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
    --accent: #0d9488; --accent-soft: rgba(13,148,136,.18);
  }
  /* dark palette: used when Appearance = Dark, or = System on a dark-mode device */
  :root[data-theme="dark"] {
    --bg: #0c0c0d; --bg2: #121214; --surface-solid: #18181b; --elev: #1d1d20;
    --line: #26262a; --line2: #35353b;
    --ink: #ededef; --ink2: #a1a1aa; --ink3: #6f6f78;
    --student: #5b8cf0; --founder: #ec8550;
    --danger: #f0544a; --warn: #e0a028; --ok: #34c06a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] {
      --bg: #0c0c0d; --bg2: #121214; --surface-solid: #18181b; --elev: #1d1d20;
      --line: #26262a; --line2: #35353b;
      --ink: #ededef; --ink2: #a1a1aa; --ink3: #6f6f78;
      --student: #5b8cf0; --founder: #ec8550;
      --danger: #f0544a; --warn: #e0a028; --ok: #34c06a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  /* dim: soft grey light theme, lower contrast than pure white */
  :root[data-theme="dim"] {
    --bg: #e9ebef; --bg2: #f3f4f6; --surface-solid: #f8f9fa; --elev: #e3e6ea;
    --line: #d7dbe1; --line2: #c3c8d0;
    --ink: #1f2329; --ink2: #4a515c; --ink3: #7b828d;
    --student: #3563c9; --founder: #c9602c;
    --danger: #c9372c; --warn: #b26f00; --ok: #198a45;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.10);
    --shadow-sm: 0 1px 2px rgba(16,24,40,.07);
    color-scheme: light;
  }
  /* graphene: charcoal grey, softer than full dark */
  :root[data-theme="graphene"] {
    --bg: #1f2125; --bg2: #26292e; --surface-solid: #2c2f35; --elev: #32363c;
    --line: #3a3e45; --line2: #4a4f57;
    --ink: #e8eaed; --ink2: #b1b6be; --ink3: #858b94;
    --student: #6e9df5; --founder: #f0955f;
    --danger: #f2695f; --warn: #e6ab3c; --ok: #4ec47e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  .stage.dragging::after { content: "Drop the image here. Drop it on a task to attach it."; position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 14px; display: grid; place-items: center; color: var(--accent); font-weight: 600; background: var(--accent-soft); pointer-events: none; z-index: 6; }
  .viewer { background: rgba(9,9,11,.82); cursor: zoom-out; }
  .viewer img { max-width: 92vw; max-height: 86vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #fff; }
  .menu h6 { margin: 4px 8px 4px; font-size: 11px; font-weight: 600; color: var(--ink3); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: "cv11", "ss01"; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: default; }
  input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  svg.i { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  @keyframes cardIn { from { transform: translateY(4px); } }
  @keyframes rec { 50% { opacity: .35; } }
  @keyframes blink { 50% { opacity: .3; } }

  .app { display: grid; grid-template-columns: minmax(0,1fr) 400px; grid-template-rows: 56px minmax(0,1fr); height: 100vh; height: 100dvh; }

  /* top bar */
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); background: var(--bg2); z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
  .brand small { font-weight: 400; font-size: 13px; color: var(--ink3); margin-left: 8px; padding-left: 10px; border-left: 1px solid var(--line2); }
  .brand > div:not(.logo) { display: flex; align-items: center; }
  .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: 0; }
  .stats { display: flex; align-items: center; margin: 0 auto; min-width: 0; }
  .chip { display: flex; align-items: baseline; gap: 6px; padding: 0 16px; font-size: 12.5px; color: var(--ink3); white-space: nowrap; border-left: 1px solid var(--line); }
  .chip:first-child { border-left: 0; }
  .chip b { color: var(--ink); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.danger b { color: var(--danger); } .chip.warn b { color: var(--warn); } .chip.ok b { color: var(--ok); }
  .chip span { font-size: 12px; }
  .bal { width: 72px; height: 4px; border-radius: 2px; background: var(--line); display: flex; overflow: hidden; align-self: center; }
  .bal i { height: 100%; transition: width .5s; }
  .actions { display: flex; align-items: center; gap: 2px; }
  .pill { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; margin-right: 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink3); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.on { color: var(--ink2); } .pill.on::before { background: var(--ok); }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--ink2); }
  .icon-btn:hover { background: var(--elev); color: var(--ink); }
  .theme-wrap { position: relative; }
  .swatch-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .menu { position: absolute; right: 0; top: 40px; z-index: 30; background: var(--surface-solid); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: none; min-width: 170px; animation: cardIn .12s ease-out; }
  .menu.on { display: block; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 6px; font-size: 13px; color: var(--ink2); }
  .menu button:hover { background: var(--elev); color: var(--ink); }
  .menu button i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .menu button.on { color: var(--ink); font-weight: 500; }
  .menu button.on::after { content: "✓"; margin-left: auto; color: var(--accent); }

  /* stage */
  .stage { position: relative; overflow: hidden; background: var(--bg); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .legend { position: absolute; left: 16px; top: 14px; display: flex; gap: 14px; font-size: 12px; color: var(--ink3); pointer-events: none; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; box-shadow: var(--shadow-sm); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; }
  .zoom { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .zoom button { width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink2); }
  .zoom button:hover { background: var(--elev); color: var(--ink); }
  .zoom button + button { border-top: 1px solid var(--line); }
  .hint { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); color: var(--ink3); font-size: 13px; pointer-events: none; text-align: center; white-space: nowrap; }
  .hint kbd { font: 500 11px Inter, sans-serif; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line2); border-bottom-width: 2px; background: var(--bg2); color: var(--ink2); }
  .card { position: absolute; z-index: 4; width: 300px; background: var(--surface-solid); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: none; animation: cardIn .15s ease-out; }
  .card.on { display: block; }
  .card h4 { margin: 0 0 10px; font-size: 14px; font-weight: 600; line-height: 1.4; word-break: break-word; letter-spacing: -.01em; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 5px; background: var(--elev); color: var(--ink2); }
  .tag.student { color: var(--student); } .tag.founder { color: var(--founder); }
  .tag.over { color: var(--danger); } .tag.soon { color: var(--warn); }
  .card .acts { display: flex; gap: 6px; margin-top: 14px; }
  .btn { height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line2); background: var(--bg2); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--shadow-sm); white-space: nowrap; }
  .btn:hover { background: var(--elev); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .9; background: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.grow { flex: 1; }

  /* panel */
  .panel { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--bg2); }
  .tabs { display: flex; gap: 20px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  .tab { height: 44px; color: var(--ink3); font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .count { font-size: 11px; background: var(--elev); color: var(--ink2); padding: 0 6px; border-radius: 4px; font-weight: 500; }
  .view { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .view.on { display: flex; }

  .agent-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; }
  .mini-orb { width: 30px; height: 30px; border-radius: 50%; flex: none; background: var(--accent); color: #fff; display: grid; place-items: center; position: relative; }
  .mini-orb::after { content: "Z"; font-weight: 700; font-size: 13px; }
  .mini-orb.listening::before { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg2); animation: rec 1.2s infinite; }
  .mini-orb.thinking, .mini-orb.speaking { box-shadow: 0 0 0 3px var(--line); }
  .agent-head b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  .agent-head span { font-size: 12px; color: var(--ink3); }
  .toggles { margin-left: auto; display: flex; gap: 6px; }
  .tg { height: 28px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--ink3); display: flex; gap: 6px; align-items: center; }
  .tg svg.i { width: 14px; height: 14px; }
  .tg.on { color: var(--ink); border-color: var(--line2); background: var(--elev); }

  .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 90%; padding: 9px 12px; border-radius: 10px; line-height: 1.5; word-wrap: break-word; animation: pop .18s ease; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.agent { align-self: flex-start; background: var(--elev); }
  .msg.interim { opacity: .55; }
  .typing { display: flex; gap: 4px; padding: 13px 14px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .achip { font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line2); background: var(--bg2); display: inline-flex; gap: 6px; align-items: center; color: var(--ink); max-width: 100%; }
  .achip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .achip:not(:disabled):hover { border-color: var(--ink3); }
  .achip:disabled { opacity: .55; }
  .achip i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .welcome { margin: auto 0; padding: 16px 4px; }
  .welcome .mini-orb { width: 40px; height: 40px; margin-bottom: 16px; }
  .welcome .mini-orb::after { font-size: 16px; }
  .welcome h3 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .welcome p { margin: 0; color: var(--ink2); max-width: 320px; }
  .sugg { display: grid; gap: 6px; margin-top: 20px; }
  .sugg button { font-size: 13px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink2); text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .sugg button::after { content: "→"; color: var(--ink3); }
  .sugg button:hover { color: var(--ink); border-color: var(--line2); background: var(--elev); }

  .composer { padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .field { flex: 1; min-width: 0; display: flex; align-items: center; background: var(--bg2); border: 1px solid var(--line2); border-radius: 10px; padding: 0 4px 0 12px; height: 44px; box-shadow: var(--shadow-sm); }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field input { flex: 1; min-width: 0; border: 0; background: none; outline: none; }
  .field input::placeholder { color: var(--ink3); }
  .send { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; color: var(--ink3); }
  .send:hover { color: var(--ink); background: var(--elev); }
  .mic { width: 44px; height: 44px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; background: var(--accent); position: relative; }
  .mic:hover { opacity: .88; }
  .mic svg.i { width: 19px; height: 19px; }
  .mic.on { background: var(--danger); color: #fff; }
  .mic.on::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: rec 1.2s infinite; }

  .tasks-head { display: flex; gap: 8px; padding: 14px 18px 6px; align-items: center; }
  .seg { display: flex; background: var(--elev); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { height: 28px; padding: 0 11px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink3); }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--bg2); color: var(--ink); box-shadow: var(--shadow-sm); }
  .seg.full { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .seg.full button.on[data-v="student"] { color: var(--student); } .seg.full button.on[data-v="founder"] { color: var(--founder); }
  .tasks-head .btn { margin-left: auto; }
  .tasklist { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 16px; }
  .group h5 { margin: 18px 6px 4px; font-size: 11.5px; font-weight: 600; color: var(--ink3); display: flex; justify-content: space-between; align-items: center; }
  .group.over h5 { color: var(--danger); }
  .linkbtn { font-size: 12px; font-weight: 500; color: var(--ink2); text-decoration: underline; text-underline-offset: 2px; }
  .task { display: flex; align-items: center; gap: 11px; padding: 9px 8px; border-radius: 8px; cursor: pointer; }
  .task:hover { background: var(--elev); }
  .check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line2); flex: none; display: grid; place-items: center; color: #fff; background: var(--bg2); }
  .check:hover { border-color: var(--accent); }
  .check svg.i { width: 12px; height: 12px; stroke-width: 3; }
  .task.done .check { background: var(--accent); border-color: var(--accent); }
  .task .body { flex: 1; min-width: 0; }
  .task .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-size: 13.5px; }
  .task.done .title { text-decoration: line-through; color: var(--ink3); }
  .task .sub { font-size: 12px; color: var(--ink3); display: flex; gap: 6px; align-items: center; }
  .sd { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .due.over { color: var(--danger); font-weight: 500; } .due.soon { color: var(--warn); font-weight: 500; }
  .pri { font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--elev); color: var(--danger); }
  .empty { text-align: center; color: var(--ink3); padding: 40px 16px; }
  .empty .btn { margin-top: 14px; }

  /* calendar */
  .cal-head { display: flex; align-items: center; gap: 2px; padding: 14px 14px 4px 18px; }
  .cal-head b { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .cal-head .btn { height: 28px; font-size: 12px; margin-right: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding: 4px 14px 12px; }
  .cal-wd { font-size: 11px; font-weight: 500; color: var(--ink3); text-align: center; padding: 6px 0; }
  .cal-cell { height: 48px; border-radius: 7px; display: flex; flex-direction: column; align-items: center; padding-top: 5px; gap: 3px; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cal-cell:hover { background: var(--elev); }
  .cal-cell.other { color: var(--ink3); opacity: .5; }
  .cal-cell.sel { background: var(--elev); box-shadow: inset 0 0 0 1px var(--line2); }
  .cal-cell .n { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
  .cal-cell.today .n { background: var(--accent); color: #fff; font-weight: 600; }
  .cal-cell.late .n { color: var(--danger); font-weight: 600; }
  .cal-cell.today.late .n { color: #fff; }
  .cal-dots { display: flex; gap: 3px; align-items: center; height: 6px; }
  .cal-dots i { width: 5px; height: 5px; border-radius: 50%; }
  .cal-dots i.hollow { background: none !important; border: 1.2px solid var(--ink3); }
  .cal-dots small { font-size: 9px; line-height: 1; color: var(--ink3); font-weight: 600; }
  .cal-day { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); padding: 0 12px 16px; }
  .cal-day-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 6px 6px; }
  .cal-day-head b { display: block; font-size: 14px; font-weight: 600; }
  .cal-day-head span { display: block; font-size: 12px; color: var(--ink3); }
  .cal-day h5 { margin: 14px 6px 4px; font-size: 11.5px; font-weight: 600; color: var(--danger); }
  .cal-empty { color: var(--ink3); padding: 18px 6px; font-size: 13px; }

  /* modal, lock, toasts */
  .modal, .lock { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 16px; background: rgba(9,9,11,.4); }
  .modal.on, .lock.on { display: grid; }
  .lock { z-index: 40; background: var(--bg); }
  .sheet { width: 100%; max-width: 440px; background: var(--surface-solid); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 22px; animation: pop .15s; }
  .sheet h3 { margin: 0 0 18px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .f { display: grid; gap: 6px; margin-bottom: 14px; }
  .f > label, .f > span { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
  .inp { height: 38px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); padding: 0 11px; outline: none; width: 100%; min-width: 0; box-shadow: var(--shadow-sm); }
  .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .foot { display: flex; gap: 8px; margin-top: 8px; }
  .foot .sp { flex: 1; }
  .muted { color: var(--ink3); margin: 0 0 16px; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin: 8px 0; }
  .toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 30; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
  .toast { pointer-events: auto; background: var(--ink); color: var(--bg2); box-shadow: var(--shadow); border-radius: 8px; padding: 9px 12px 9px 14px; display: flex; gap: 14px; align-items: center; font-size: 13px; animation: pop .15s; max-width: 100%; }
  .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { color: var(--bg2); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; flex: none; }

  @media (max-width: 1180px) { .chip.opt { display: none; } .app { grid-template-columns: minmax(0,1fr) 370px; } }
  /* ===== Liquid Glass: translucent panes floating over the board, pill controls, springy motion ===== */
  :root {
    --spring: cubic-bezier(.2, .9, .25, 1.12);
    --g-bg: rgba(255,255,255,.55); --g-strong: rgba(255,255,255,.78); --g-fill: rgba(255,255,255,.5);
    --g-border: rgba(255,255,255,.8); --g-edge: rgba(15,23,42,.07); --g-hi: rgba(255,255,255,.95);
    --g-shadow: 0 1px 1px rgba(16,24,40,.04), 0 12px 40px rgba(16,24,40,.12);
    --g-blur: blur(26px) saturate(180%);
  }
  :root[data-theme="dim"] { --g-bg: rgba(244,246,249,.58); --g-strong: rgba(247,248,250,.82); --g-fill: rgba(255,255,255,.42); --g-border: rgba(255,255,255,.7); }
  :root[data-theme="dark"], :root[data-theme="graphene"] {
    --g-bg: rgba(32,33,38,.55); --g-strong: rgba(38,39,45,.82); --g-fill: rgba(255,255,255,.07);
    --g-border: rgba(255,255,255,.12); --g-edge: rgba(0,0,0,.4); --g-hi: rgba(255,255,255,.14);
    --g-shadow: 0 1px 1px rgba(0,0,0,.3), 0 14px 44px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] {
      --g-bg: rgba(32,33,38,.55); --g-strong: rgba(38,39,45,.82); --g-fill: rgba(255,255,255,.07);
      --g-border: rgba(255,255,255,.12); --g-edge: rgba(0,0,0,.4); --g-hi: rgba(255,255,255,.14);
      --g-shadow: 0 1px 1px rgba(0,0,0,.3), 0 14px 44px rgba(0,0,0,.5);
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, "Segoe UI", sans-serif; letter-spacing: -.005em; }
  /* a soft colour wash behind the board gives the glass something to refract */
  .stage { background:
      radial-gradient(900px 620px at 12% 18%, color-mix(in srgb, var(--student) 13%, transparent), transparent 62%),
      radial-gradient(820px 600px at 88% 85%, color-mix(in srgb, var(--founder) 11%, transparent), transparent 62%),
      radial-gradient(760px 520px at 55% 45%, var(--accent-soft), transparent 66%),
      var(--bg); }
  .top, .panel, .legend, .zoom, .card, .menu, .sheet, .toast {
    background: var(--g-bg); backdrop-filter: var(--g-blur); -webkit-backdrop-filter: var(--g-blur);
    border: 1px solid var(--g-border); box-shadow: var(--g-shadow), inset 0 1px 0 var(--g-hi), inset 0 0 0 .5px var(--g-edge);
  }
  .card, .menu, .sheet, .toast { background: var(--g-strong); }
  .card { border-radius: 22px; animation: glassIn .38s var(--spring); }
  .menu { border-radius: 18px; padding: 8px; animation: glassIn .32s var(--spring); }
  .menu button { border-radius: 10px; }
  .sheet { border-radius: 28px; animation: glassIn .38s var(--spring); }
  .toast { color: var(--ink); border-radius: 999px; padding: 10px 14px 10px 18px; }
  .toast button { color: var(--accent); }
  .legend { border-radius: 999px; padding: 7px 14px; }
  .zoom { border-radius: 18px; }
  .zoom button + button { border-top-color: var(--g-border); }
  @keyframes glassIn { from { transform: translateY(10px) scale(.95); } }
  .modal { background: rgba(10,10,14,.22); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .lock { background: var(--bg); }
  .viewer { background: rgba(10,10,14,.72); }
  .btn { border-radius: 999px; background: var(--g-fill); border: 1px solid var(--g-border); box-shadow: inset 0 1px 0 var(--g-hi), 0 1px 2px rgba(0,0,0,.06);
    transition: transform .3s var(--spring), background .2s, filter .2s; }
  .btn:hover { background: var(--g-strong); }
  .btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 82%, #fff), var(--accent)); border-color: color-mix(in srgb, var(--accent) 65%, #fff);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 6px 16px var(--accent-soft); }
  .btn.primary:hover { opacity: 1; filter: brightness(1.06); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 82%, #fff), var(--accent)); }
  .icon-btn, .send, .tab, .seg button, .achip, .sugg button, .task, .cal-cell, .tg, .mic, .fab { transition: transform .3s var(--spring), background .25s, color .2s, box-shadow .3s; }
  .btn:active, .icon-btn:active, .tab:active, .seg button:active, .achip:active, .sugg button:active, .task:active, .cal-cell:active, .tg:active, .send:active, .mic:active { transform: scale(.94); }
  .icon-btn { border-radius: 999px; }
  .icon-btn:hover { background: var(--g-fill); border-color: transparent; }
  .logo { border-radius: 9px; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 12px var(--accent-soft); }
  .pill, .tg { border-radius: 999px; background: var(--g-fill); border-color: var(--g-border); }
  .inp { border-radius: 14px; background: var(--g-fill); border-color: var(--g-border); box-shadow: inset 0 1px 2px rgba(0,0,0,.05); }
  .field { border-radius: 999px; height: 50px; padding-left: 18px; background: var(--g-fill); border-color: var(--g-border); box-shadow: inset 0 1px 2px rgba(0,0,0,.05); }
  .send { border-radius: 999px; }
  .mic { border-radius: 50%; width: 50px; height: 50px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 82%, #fff), var(--accent));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 6px 18px var(--accent-soft); }
  .mic:hover { opacity: 1; filter: brightness(1.06); }
  .composer { border-top-color: transparent; }
  /* tabs and filters become glass segmented controls */
  .tabs { margin: 12px 14px 6px; padding: 4px; gap: 4px; border: 0; border-radius: 999px; background: var(--g-fill); box-shadow: inset 0 1px 2px rgba(0,0,0,.06); }
  .tab { flex: 1; justify-content: center; height: 34px; border: 0; margin: 0; border-radius: 999px; }
  .tab.on { background: var(--g-strong); border-bottom-color: transparent; box-shadow: 0 2px 10px rgba(0,0,0,.10), inset 0 1px 0 var(--g-hi); }
  .seg { border-radius: 999px; background: var(--g-fill); border-color: var(--g-border); padding: 3px; }
  .seg button { border-radius: 999px; }
  .seg button.on { background: var(--g-strong); box-shadow: 0 2px 8px rgba(0,0,0,.10), inset 0 1px 0 var(--g-hi); }
  /* chat */
  .msg { border-radius: 20px; padding: 10px 14px; }
  .msg.user { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff), var(--accent)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 14px var(--accent-soft); border-bottom-right-radius: 8px; }
  .msg.agent { background: var(--g-strong); border: 1px solid var(--g-border); box-shadow: inset 0 1px 0 var(--g-hi), 0 2px 10px rgba(0,0,0,.05); border-bottom-left-radius: 8px; }
  .achip { border-radius: 999px; background: var(--g-fill); border-color: var(--g-border); }
  .sugg button { border-radius: 16px; background: var(--g-fill); border-color: var(--g-border); }
  .sugg button:hover { background: var(--g-strong); }
  /* tasks + calendar */
  .task { border-radius: 14px; }
  .task:hover { background: var(--g-fill); }
  .check { border-radius: 50%; background: var(--g-fill); }
  .cal-cell { border-radius: 12px; }
  .cal-cell:hover { background: var(--g-fill); }
  .cal-cell.sel { background: var(--g-strong); box-shadow: 0 2px 10px rgba(0,0,0,.08), inset 0 1px 0 var(--g-hi); }
  .cal-cell .n { border-radius: 50%; }
  .cal-cell.today .n { box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 3px 10px var(--accent-soft); }
  .cal-day { border-top-color: var(--g-border); }
  .tag { border-radius: 999px; background: var(--g-fill); }

  /* desktop: the board fills the window; the bar and panel float over it */
  @media (min-width: 861px) {
    .app { display: block; height: 100vh; height: 100dvh; }
    .stage { position: fixed; inset: 0; }
    .top { position: fixed; top: 12px; left: 12px; right: 12px; height: 60px; border-radius: 22px; z-index: 6; padding: 0 12px 0 16px; }
    .panel { position: fixed; top: 84px; right: 12px; bottom: 12px; width: 400px; border-radius: 28px; z-index: 5; overflow: hidden; }
    .legend { top: 86px; left: 24px; }
    .zoom { right: 436px; bottom: 24px; }
    .hint { left: calc((100% - 424px) / 2); }
  }
  @media (min-width: 861px) and (max-width: 1180px) {
    .panel { width: 360px; } .zoom { right: 396px; } .hint { left: calc((100% - 384px) / 2); }
  }

  /* glass: the floating mic and captions on phones */
  :root { --glass-solid: rgba(255,255,255,.86); --glass: rgba(255,255,255,.62); --glass-2: rgba(255,255,255,.26); --glass-border: rgba(255,255,255,.85); --glass-shadow: 0 12px 34px rgba(16,24,40,.18); }
  :root[data-theme="dark"], :root[data-theme="graphene"] { --glass-solid: rgba(32,34,39,.86); --glass: rgba(46,48,54,.58); --glass-2: rgba(20,20,24,.30); --glass-border: rgba(255,255,255,.14); --glass-shadow: 0 12px 34px rgba(0,0,0,.55); }
  @media (prefers-color-scheme: dark) { :root[data-theme="system"] { --glass-solid: rgba(32,34,39,.86); --glass: rgba(46,48,54,.58); --glass-2: rgba(20,20,24,.30); --glass-border: rgba(255,255,255,.14); --glass-shadow: 0 12px 34px rgba(0,0,0,.55); } }
  .fab-wrap, .scrim, .sheet-grab { display: none; }
  .fab { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); position: relative;
    background: linear-gradient(150deg, var(--glass), var(--glass-2));
    backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
    border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .15s, background .25s, color .25s; -webkit-tap-highlight-color: transparent; }
  .fab:active { transform: scale(.93); }
  .fab svg.i { width: 30px; height: 30px; stroke-width: 1.8; }
  .fab.on { color: #fff; background: linear-gradient(150deg, rgba(240,68,56,.88), rgba(200,40,30,.72)); border-color: rgba(255,255,255,.35); }
  .fab.on::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid rgba(240,68,56,.55); animation: fabring 1.5s ease-out infinite; }
  .fab.talk:not(.on) { color: #fff; background: linear-gradient(150deg, var(--accent), var(--accent)); }
  .fab.busy::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2.5px solid transparent; border-top-color: var(--accent); animation: spin .9s linear infinite; }
  @keyframes fabring { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.38); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grab-btn { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--ink3); font-size: 11px; font-weight: 500; padding: 4px 18px; -webkit-tap-highlight-color: transparent; }
  .grab-btn span { width: 38px; height: 4px; border-radius: 2px; background: var(--ink3); opacity: .55; }
  .caption { max-width: min(90vw, 440px); margin-bottom: 14px; padding: 11px 16px; border-radius: 18px; text-align: center; font-size: 15px; line-height: 1.45; color: var(--ink);
    background: var(--glass); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%);
    border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); display: none; cursor: pointer; background: var(--glass-solid); }
  .caption.on { display: block; animation: cardIn .2s ease-out; }
  .caption small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink3); margin-bottom: 3px; letter-spacing: .02em; }
  .caption .chips { justify-content: center; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0,1fr); grid-template-rows: 52px minmax(0,1fr); }
    .stats, .brand small, .legend, .hint, #zIn, #zOut { display: none; }
    .top { gap: 8px; padding: 0 8px 0 14px; } .actions { margin-left: auto; }
    .zoom { right: 12px; top: 12px; bottom: auto; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
      backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); }
    .zoom button { width: 44px; height: 44px; }
    .zoom button + button { border-top-color: var(--glass-border); }
    .card { position: fixed; left: 12px !important; right: 12px; top: auto !important; bottom: calc(132px + env(safe-area-inset-bottom)); width: auto; z-index: 12; border-radius: 16px; padding: 16px; }
    .card .btn { height: 40px; }
    .fab-wrap { display: flex; flex-direction: column; align-items: center; position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 11; width: max-content; max-width: 100vw; transition: opacity .25s, transform .25s; }
    body.sheet-open .fab-wrap { opacity: 0; pointer-events: none; transform: translate(-50%, 24px); }
    .scrim { display: block; position: fixed; inset: 0; z-index: 14; background: rgba(0,0,0,.34); opacity: 0; pointer-events: none; transition: opacity .3s; }
    body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; height: 84dvh; z-index: 15; border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
      box-shadow: 0 -14px 44px rgba(0,0,0,.25); transform: translateY(105%); visibility: hidden;
      transition: transform .34s cubic-bezier(.2,.8,.2,1), visibility 0s linear .34s; }
    body.sheet-open .panel { transform: none; visibility: visible; transition: transform .34s cubic-bezier(.2,.8,.2,1); }
    .panel.dragging { transition: none !important; }
    .sheet-grab { display: flex; justify-content: center; padding: 10px 0 0; touch-action: none; }
    .sheet-grab span { width: 42px; height: 5px; border-radius: 3px; background: var(--line2); }
    .tabs { touch-action: none; }
    .toasts { bottom: calc(150px + env(safe-area-inset-bottom)); }
    body.sheet-open .toasts { bottom: 24px; }
    #vCal { overflow-y: auto; }
    #vCal .cal-day { flex: none; overflow: visible; }
    .cal-cell { height: 44px; }
    .task { padding: 12px 8px; }
  }
  /* phones: board full screen behind a floating glass bar; the sheet is glass too */
  @media (max-width: 860px) {
    .app { display: block; height: 100vh; height: 100dvh; }
    .stage { position: fixed; inset: 0; }
    .top { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px; height: 54px; border-radius: 20px; z-index: 6; padding: 0 6px 0 12px; }
    .zoom { top: calc(74px + env(safe-area-inset-top)); }
    .panel { background: var(--g-strong); border-radius: 28px 28px 0 0; }
    .tabs { margin-top: 6px; }
  }
  @media (max-width: 420px) { .pill { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">Z</div><div>Zia<small>Student × Founder workspace</small></div></div>
    <div class="stats">
      <div class="chip"><b id="stPending">0</b>pending</div>
      <div class="chip danger"><b id="stOver">0</b>overdue</div>
      <div class="chip warn"><b id="stSoon">0</b>due soon</div>
      <div class="chip ok opt"><b id="stDone">0</b>done this week</div>
      <div class="chip opt" title="Pending work split"><span style="color:var(--student)">Student</span><div class="bal"><i id="balS" style="background:var(--student);width:50%"></i><i id="balF" style="background:var(--founder);width:50%"></i></div><span style="color:var(--founder)">Founder</span></div>
    </div>
    <div class="actions">
      <span class="pill" id="aiPill">Connecting…</span>
      <div class="theme-wrap">
        <button class="icon-btn" id="btnTheme" title="Appearance and colour" aria-label="Appearance and colour" aria-haspopup="true"><span class="swatch-dot"></span></button>
        <div class="menu" id="themeMenu" role="menu"></div>
      </div>
      <button class="icon-btn" id="btnNew" title="New task (N)" aria-label="New task"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="btnExport" title="Export backup" aria-label="Export backup"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
      <button class="icon-btn" id="btnImport" title="Import backup" aria-label="Import backup"><svg class="i" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg></button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </header>

  <section class="stage" id="stage">
    <canvas id="graph" aria-label="Map of your tasks"></canvas>
    <div class="legend"><span><i style="background:var(--student)"></i>Student</span><span><i style="background:var(--founder)"></i>Founder</span><span><i style="border:2px solid var(--danger)"></i>Overdue</span><span><i style="border:2px solid var(--warn)"></i>Due soon</span></div>
    <div class="hint" id="hint">Press <kbd>Space</kbd> to turn on the mic, then just talk. I'll keep listening.</div>
    <div class="zoom">
      <button id="zImg" title="Add an image (or paste with Ctrl+V)" aria-label="Add image"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
      <button id="zIn" title="Zoom in" aria-label="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zOut" title="Zoom out" aria-label="Zoom out"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zFit" title="Fit everything (F)" aria-label="Fit view"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="card" id="card"></div>
  </section>

  <aside class="panel">
    <div class="sheet-grab" id="sheetGrab" aria-hidden="true"><span></span></div>
    <div class="tabs" role="tablist">
      <button class="tab on" data-view="vAgent" role="tab">Agent</button>
      <button class="tab" data-view="vCal" role="tab">Calendar</button>
      <button class="tab" data-view="vTasks" role="tab">Tasks <span class="count" id="taskCount">0</span></button>
    </div>

    <section class="view on" id="vAgent">
      <div class="agent-head">
        <div class="mini-orb" id="miniOrb"></div>
        <div><b>Zia</b><span id="agentState">Ready</span></div>
        <div class="toggles">
          <button class="tg" id="tgVoice" title="Speak replies aloud"><svg class="i" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>Voice</button>
        </div>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="composer" id="composer">
        <div class="field">
          <input id="askText" placeholder="Talk or type to Zia…" autocomplete="off" aria-label="Message Zia">
          <button class="send" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <button type="button" class="mic" id="mic" aria-label="Talk to Zia"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg></button>
      </form>
    </section>

    <section class="view" id="vCal">
      <div class="cal-head">

<script>
"use strict";
/* ================= basics ================= */
const CATS = {
  student: ["Assignment", "Exam", "Project", "Lab", "Other"],
  founder: ["Product", "Customers", "Fundraising", "Team", "Other"]
};
const DAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
const CHECK_SVG = '<svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const localISO = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const validDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d || "") ? d : "";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let items = store.get("krefter_v2", null) || store.get("krefter", []);
let chat = store.get("krefter_chat", []);
let images = store.get("krefter_images", []); // pictures pinned on the board: {id, src, w, h, size, attach, dx, dy, x, y}
const settings = Object.assign({ voiceOn: true, accent: "#0d9488", theme: "light" }, store.get("krefter_settings", {}));
const SERVER = location.protocol.startsWith("http");
const AI = { ok: false };
let passKey = store.get("krefter_key", "");
let serverReady = false;

function daysLeft(due) {
  if (!due) return null;
  const d = new Date(due + "T00:00:00"), t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 864e5);
}
function urgency(it) {
  if (it.done || !it.due) return "";
  const d = daysLeft(it.due);
  return d < 0 ? "over" : d <= 2 ? "soon" : "";
}
function dueLabel(due) {
  const d = daysLeft(due);
  if (d === null) return "No date";
  if (d < 0) return -d + "d overdue";
  if (d === 0) return "Today";
  if (d === 1) return "Tomorrow";
  const dt = new Date(due + "T00:00:00");
  return d < 7 ? dt.toLocaleDateString(undefined, { weekday: "long" }) : dt.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function sortPending(a, b) {
  const da = a.due || "9999", db = b.due || "9999";
  return da === db ? (b.pri || 2) - (a.pri || 2) : da < db ? -1 : 1;
}

/* ================= persistence ================= */
let syncTimer = null;
function api(path, opts = {}) {
  opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {}, passKey ? { "X-Zia-Key": passKey } : {});
  return fetch(path, opts);
}
function persist() {
  store.set("krefter_v2", items);
  store.set("krefter_chat", chat.slice(-80));
  try { localStorage.setItem("krefter_images", JSON.stringify(images)); }
  catch (e) { if (!persist.warned) { persist.warned = true; toast("This browser's storage is full. Run Zia through the server to keep more images."); } }
  if (SERVER && serverReady) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => api("/api/items", { method: "PUT", body: JSON.stringify({ items, chat: chat.slice(-80), images }) }).catch(() => {}), 400);
  }
}
function update() {
  persist(); build(); renderStats(); renderTasks(); renderCal();
  if (G.sel) { const n = G.byId[G.sel]; n ? showCard(n) : hideCard(); }
}

/* ================= graph engine (canvas) ================= */
const canvas = $("#graph"), ctx = canvas.getContext("2d");
const G = { nodes: [], links: [], byId: {}, cam: { x: 0, y: 0, k: 1 }, target: null, userCam: false, alpha: 1,
  hover: null, sel: null, drag: null, W: 0, H: 0, dpr: 1, t: 0, fc: 0, orb: "idle", level: 0, first: true, ls: 1 };
const C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  ["bg", "bg2", "ink", "ink2", "ink3", "line", "line2", "student", "founder", "danger", "warn", "ok", "surface-solid", "elev", "accent"].forEach(k => C[k] = cs.getPropertyValue("--" + k).trim());
}
function rgba(hex, a) {
  let h = (hex || "#888888").replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
const sideColor = s => s === "founder" ? C.founder : C.student;
const HUB = 290;
function hubPos(side) {
  const dir = side === "student" ? -1 : 1, wide = G.W >= G.H * .9;
  return wide ? { x: dir * HUB, y: 0 } : { x: 0, y: dir * HUB * .62 }; // upright phones: hubs closer so the map uses the width
}

function shortLabel(t) { // phones get shorter labels so the whole map fits bigger; tap a task for its full title
  const max = G.ls > 1 ? 18 : 28;
  return t.length > max ? t.slice(0, max - 1).trimEnd() + "…" : t;
}
function jitter(id, salt) { // deterministic value in [-0.5, 0.5) from a node id
  let h = 2166136261 ^ salt;
  for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619);
  return ((h >>> 0) % 10000) / 10000 - .5;
}
function build() {
  const keep = G.byId, now = performance.now(), nodes = [], links = [];
  const add = (id, kind, extra, from) => {
    const old = keep[id];
    const n = Object.assign({ id, kind, x: 0, y: 0, vx: 0, vy: 0, born: G.first ? now - 2000 : now }, extra);
    if (old) Object.assign(n, { x: old.x, y: old.y, vx: old.vx, vy: old.vy, born: old.born });
    else if (from) { n.x = from.x + jitter(id, 1) * 24; n.y = from.y + jitter(id, 2) * 24; } // same start each time, so the map opens the same way
    nodes.push(n); return n;
  };
  const ns = G.ls > 1 ? 1.3 : 1; // phones: bigger circles and text so the map reads at a glance
  const me = add("me", "me", { r: 46 * ns });
  const hubs = {};
  ["student", "founder"].forEach(s => {
    const h = add("hub-" + s, "hub", { side: s, r: 38 * ns, label: s === "student" ? "Student" : "Founder", parent: me });
    const p = hubPos(s); h.x = p.x; h.y = p.y; hubs[s] = h;
    links.push({ a: me, b: h, seed: Math.random() });
  });
  const cats = {};
  items.forEach(it => {
    const cid = "cat-" + it.side + "-" + it.cat;
    let c = cats[cid];
    if (!c) {
      c = add(cid, "cat", { side: it.side, r: 22 * ns, label: it.cat, parent: hubs[it.side] }, hubs[it.side]);
      cats[cid] = c; links.push({ a: hubs[it.side], b: c, d: 135 * G.ls, seed: Math.random() });
    }
    const n = add(it.id, "item", { side: it.side, item: it, r: (9 + (it.pri || 2) * 2.6) * ns, parent: c }, c);
    ctx.font = `500 ${12 * G.ls}px ${FONT}`; // label width, so the layout can keep labels apart
    n.lw = Math.max(ctx.measureText(shortLabel(it.text)).width, 70);
    links.push({ a: c, b: n, d: 90 * G.ls, seed: Math.random() });
  });
  nodes.forEach(n => {
    if (n.kind === "hub" || n.kind === "cat") {
      const all = items.filter(i => n.kind === "hub" ? i.side === n.side : "cat-" + i.side + "-" + i.cat === n.id);
      n.total = all.length; n.open = all.filter(i => !i.done).length;
    }
  });
  G.nodes = nodes; G.links = links; G.byId = {};
  nodes.forEach(n => G.byId[n.id] = n);
  if (G.hover) G.hover = G.byId[G.hover.id] || null;
  if (G.sel && !G.byId[G.sel]) { G.sel = null; hideCard(); }
  if (G.first) {
    G.alpha = 1;
    for (let i = 0; i < 400 && G.alpha > .01; i++) physics();
    G.first = false; G.alpha = .05;
    if (!G.userCam) fit(true);
  } else G.alpha = Math.max(G.alpha, .9);
  $("#hint").style.display = items.length ? "none" : "";
  if (!items.length && isMobile() && !capKind) showCaption("hint", "Hi, I'm Zia", "Tap the mic and tell me what you have.", null, true);
  else if (items.length && capKind === "hint") hideCaption();
}

function physics() {
  const N = G.nodes, a = G.alpha;
  if (a < .01) return;
  for (let i = 0; i < N.length; i++) {
    const p = N[i];
    for (let j = i + 1; j < N.length; j++) {
      const q = N[j];
      let dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
      if (d2 > 90000) continue;
      if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const d = Math.sqrt(d2), min = p.r + q.r + (p.kind === "item" && q.kind === "item" ? 72 : 44); // room for labels + date bubbles
      let f = 2600 / d2;
      if (d < min) f += (min - d) * .08;
      dx /= d; dy /= d;
      p.vx += dx * f; p.vy += dy * f; q.vx -= dx * f; q.vy -= dy * f;
      if (p.lw && q.lw) { // keep task labels (and their date tags) from overlapping
        const ox = (p.lw + q.lw) / 2 + 14 - Math.abs(p.x - q.x), oy = p.r + q.r + 58 * G.ls - Math.abs(p.y - q.y); // date tag above + label below
        if (ox > 0 && oy > 0) {
          if (ox < oy) { const s = Math.sign(p.x - q.x) || 1; p.vx += s * ox * .1; q.vx -= s * ox * .1; }
          else { const s = Math.sign(p.y - q.y) || 1; p.vy += s * oy * .1; q.vy -= s * oy * .1; }
        }
      }
    }
  }
  G.links.forEach(l => {
    if (!l.d) return;
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || 1, f = (d - l.d) * .05;
    const fx = dx / d * f, fy = dy / d * f;
    l.a.vx += fx; l.a.vy += fy; l.b.vx -= fx; l.b.vy -= fy;
  });
  N.forEach(n => {
    if (n.kind === "me") { n.x = 0; n.y = 0; n.vx = n.vy = 0; return; }
    if (n.kind === "hub") { const p = hubPos(n.side); n.x = p.x; n.y = p.y; n.vx = n.vy = 0; return; }
    if (n.kind === "cat") { // fan categories outward, away from "You"
      const p = hubPos(n.side), len = Math.hypot(p.x, p.y) || 1;
      const upright = G.W < G.H * .9, out = (upright ? 120 : 170) * G.ls;
      n.vx += (p.x + p.x / len * out - n.x) * .012; n.vy += (p.y + p.y / len * out - n.y) * (upright ? .008 : .012);
    }
    if (n.kind === "item") { // items lean away from their hub
      const h = n.parent.parent, dx = n.x - h.x, dy = n.y - h.y, d = Math.hypot(dx, dy) || 1;
      n.vx += dx / d * .6; n.vy += dy / d * .6;
    }
    if (G.drag && G.drag.node === n) { n.vx = n.vy = 0; return; }
    n.vx *= .8; n.vy *= .8;
    n.x += n.vx * a; n.y += n.vy * a;
  });
  G.alpha *= .988;
}

/* camera */
const toWorld = (sx, sy) => ({ x: (sx - G.W / 2 - G.cam.x) / G.cam.k, y: (sy - G.H / 2 - G.cam.y) / G.cam.k });
const toScreen = (wx, wy) => ({ x: G.W / 2 + G.cam.x + wx * G.cam.k, y: G.H / 2 + G.cam.y + wy * G.cam.k });
// The board fills the window and the glass bar/panel/mic float over it,
// so fit and focus aim at the uncovered part of the board.
function boardInsets() {
  if (isMobile()) { const top = $(".top").getBoundingClientRect(); return { t: top.bottom + 12, r: 0, b: 160, l: 0 }; }
  const top = $(".top").getBoundingClientRect(), pan = $(".panel").getBoundingClientRect();
  return { t: top.bottom + 10, r: Math.max(0, G.W - pan.left + 12), b: 16, l: 0 };
}
function fit(instant, nodes = G.nodes) {
  if (!G.W || !nodes.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(n => {
    const px = n.r + (n.kind === "item" ? Math.max(70, (n.lw || 0) / 2 + 10) : 40), py = n.r + (n.kind === "item" ? 44 * G.ls : 30);
    x0 = Math.min(x0, n.x - px); x1 = Math.max(x1, n.x + px); y0 = Math.min(y0, n.y - py); y1 = Math.max(y1, n.y + py);
  });
  if (nodes === G.nodes) images.forEach(im => {
    const p = imgPos(im), s = imgSize(im);
    x0 = Math.min(x0, p.x - s.w / 2 - 20); x1 = Math.max(x1, p.x + s.w / 2 + 20); y0 = Math.min(y0, p.y - s.h / 2 - 20); y1 = Math.max(y1, p.y + s.h / 2 + 20);
  });
  // on phones keep the board clear of the top buttons and the floating mic
  const pad = boardInsets();
  let k = Math.max(.3, Math.min((G.W - pad.l - pad.r) / (x1 - x0), (G.H - pad.t - pad.b) / (y1 - y0), 1.35) * .94);
  if (isMobile() && !fit.all) k = Math.max(k, .52); // phones: keep text readable (~9-10px); drag to see the edges
  fit.all = false;
  const t = { k, x: -(x0 + x1) / 2 * k + (pad.l - pad.r) / 2, y: -(y0 + y1) / 2 * k + (pad.t - pad.b) / 2 };
  if (instant) { G.cam = t; G.target = null; } else G.target = t;
}
function zoomAt(sx, sy, f) {
  const k = Math.min(3, Math.max(.25, G.cam.k * f)), w = toWorld(sx, sy);
  G.cam.k = k; G.cam.x = sx - G.W / 2 - w.x * k; G.cam.y = sy - G.H / 2 - w.y * k;
  G.target = null; G.userCam = true;
}
function nodeAt(sx, sy) {
  const p = toWorld(sx, sy);
  let best = null, bd = Infinity;
  for (const n of G.nodes) {
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d < n.r + (isMobile() ? 16 : 6) / G.cam.k && d < bd) { bd = d; best = n; } // bigger tap targets for fingers
  }
  return best;
}
function focusSet() {
  const n = G.sel ? G.byId[G.sel] : G.hover;
  if (!n || n.kind === "me") return null;
  const s = new Set([n.id, "me"]);
  if (n.kind === "item") { s.add(n.parent.id); s.add(n.parent.parent.id); }
  else if (n.kind === "cat") { s.add(n.parent.id); G.nodes.forEach(m => { if (m.parent === n) s.add(m.id); }); }
  else if (n.kind === "hub") G.nodes.forEach(m => { if (m.parent === n || (m.parent && m.parent.parent === n)) s.add(m.id); });
  return s;
}

/* drawing */
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function easeBack(x) { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif";

function draw() {
  const { W, H, dpr, cam } = G, k = cam.k, now = performance.now();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const gap = 28 * k;
  if (gap > 12) {
    ctx.fillStyle = rgba(C.ink3, .22);
    const ox = ((W / 2 + cam.x) % gap + gap) % gap, oy = ((H / 2 + cam.y) % gap + gap) % gap;
    for (let x = ox; x < W; x += gap) for (let y = oy; y < H; y += gap) ctx.fillRect(x, y, 1.3, 1.3);
  }
  ctx.translate(W / 2 + cam.x, H / 2 + cam.y);
  ctx.scale(k, k);
  const fs = focusSet();

  G.links.forEach(l => {
    const { a, b } = l, col = sideColor(b.side), faded = fs && !(fs.has(a.id) && fs.has(b.id));
    const done = b.kind === "item" && b.item.done;
    const grow = Math.min(1, (now - b.born) / 500);
    const bx = a.x + (b.x - a.x) * grow, by = a.y + (b.y - a.y) * grow;
    const mx = (a.x + bx) / 2, my = (a.y + by) / 2, cx = mx - (by - a.y) * .12, cy = my + (bx - a.x) * .12;
    const focused = fs && !faded;
    ctx.strokeStyle = faded ? rgba(C.ink3, .08) : focused ? rgba(col, .75) : done ? rgba(C.ink3, .18) : rgba(b.kind === "item" ? col : C.ink3, b.kind === "item" ? .35 : .45);
    ctx.lineWidth = b.kind === "item" ? 1 : b.kind === "cat" ? 1.4 : 1.8;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(cx, cy, bx, by); ctx.stroke();
  });

  drawImages(fs);
  const order = { item: 0, cat: 1, hub: 2, me: 3 };
  [...G.nodes].sort((p, q) => order[p.kind] - order[q.kind]).forEach(n => drawNode(n, fs && !fs.has(n.id), now));
  G.nodes.forEach(n => { if (n.kind === "item") drawItemLabel(n, fs && !fs.has(n.id), now); });
}

/* images pinned on the board */
const imgCache = {};
function imgEl(im) {
  let c = imgCache[im.id];
  if (!c || c.dataset.src !== im.src) { c = new Image(); c.dataset.src = im.src; c.src = im.src; imgCache[im.id] = c; }
  return c;
}
function imgPos(im) { // attached images ride along with their node
  const n = im.attach && G.byId[im.attach];
  if (n) return { x: n.x + im.dx, y: n.y + im.dy };
  return im.attach ? { x: im.lastX || 0, y: im.lastY || 0 } : { x: im.x, y: im.y };
}
function imgSize(im) { const w = im.size || 170; return { w, h: w * (im.h / im.w || .75) }; }
function imageAt(sx, sy) {
  const p = toWorld(sx, sy);
  for (let i = images.length - 1; i >= 0; i--) {
    const im = images[i], c = imgPos(im), s = imgSize(im);
    if (Math.abs(p.x - c.x) <= s.w / 2 + 6 && Math.abs(p.y - c.y) <= s.h / 2 + 6) return im;
  }
  return null;

const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const calMonth = new Date(); calMonth.setDate(1);
let calSel = localISO(new Date());
function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), today = localISO(new Date());
  $("#calTitle").textContent = MONTHS_LONG[m] + " " + y;
  const grid = $("#calGrid"); grid.replaceChildren();
  ["M", "T", "W", "T", "F", "S", "S"].forEach(d => grid.append(el("div", "cal-wd", d)));
  const start = new Date(y, m, 1); start.setDate(1 - (start.getDay() + 6) % 7); // weeks start on Monday
  const byDay = {};
  items.forEach(i => { if (i.due) (byDay[i.due] = byDay[i.due] || []).push(i); });
  for (let c = 0; c < 42; c++) {
    const dt = new Date(start); dt.setDate(start.getDate() + c);

    const dots = el("div", "cal-dots");

    if (list.length > 3) dots.append(el("small", null, "+" + (list.length - 3)));

  // selected day

function applyActions(actions) {
  const chips = [], norm = s => s === "founder" ? "founder" : "student";
  (Array.isArray(actions) ? actions : []).slice(0, 15).forEach(a => {
    if (!a || typeof a !== "object") return;
    if (a.type === "add") {
      const text = String(a.text || "").trim().slice(0, 120);
      if (!text) return;
      const side = norm(a.side);
      const it = { id: uid(), text, side, cat: CATS[side].includes(a.cat) ? a.cat : "Other", pri: [1, 2, 3].includes(+a.pri) ? +a.pri : 2,
        due: validDate(a.due), done: false, doneAt: null, created: Date.now() };
      items.push(it);
      chips.push({ label: "+ " + text + (it.due ? " · " + dueLabel(it.due) : ""), id: it.id, side });
      return;
    }
    const it = items.find(i => i.id === a.id);
    if (!it) return;
    if (a.type === "done" && !it.done) { it.done = true; it.doneAt = Date.now(); chips.push({ label: "✓ " + it.text, id: it.id, side: it.side }); }
    else if (a.type === "undo" && it.done) { it.done = false; it.doneAt = null; chips.push({ label: "↺ " + it.text, id: it.id, side: it.side }); }
    else if (a.type === "delete") { items = items.filter(i => i !== it); chips.push({ label: "✕ " + it.text, side: it.side }); }
    else if (a.type === "edit") {
      if (typeof a.text === "string" && a.text.trim()) it.text = a.text.trim().slice(0, 120);
      if (a.side) it.side = norm(a.side);
      if (a.cat && CATS[it.side].includes(a.cat)) it.cat = a.cat;
      if (!CATS[it.side].includes(it.cat)) it.cat = "Other";
      if ([1, 2, 3].includes(+a.pri)) it.pri = +a.pri;
      if ("due" in a) it.due = validDate(a.due);
      chips.push({ label: "✎ " + it.text + (it.due ? " · " + dueLabel(it.due) : ""), id: it.id, side: it.side });
    }
  });
  return chips;
}

/* offline brain: simple phrases when the AI is unavailable */
const FOUNDER_WORDS = /startup|founder|investor|pitch|customer|client|product|landing|hire|hiring|team|fundrais|funding|mvp|launch|company|business|revenue|demo|sales/i;
const STUDENT_WORDS = /college|assignment|exam|\blab\b|class|record|internal|semester|viva|quiz|homework|submission|professor|lecture|syllabus|test/i;
const CAT_WORDS = {
  student: [["Exam", /exam|quiz|test|viva|internal/i], ["Lab", /\blab\b|record|practical/i], ["Project", /project|report|presentation/i], ["Assignment", /assignment|homework|submission|essay/i]],
  founder: [["Fundraising", /invest|pitch|fundrais|funding|deck/i], ["Customers", /customer|client|interview|sales/i], ["Product", /product|landing|feature|mvp|launch|build|demo|app|website/i], ["Team", /hire|hiring|team|intern|co-?founder/i]]
};
function parseAdd(raw) {
  let s = raw.replace(/^(please\s+)?(remember|note|add|i have|i've got|i got|i need to|i must|i should)\b[:,]?\s*/i, "").trim(), due = "", m;
  const at = n => { const d = new Date(); d.setDate(d.getDate() + n); return localISO(d); };
  const cut = re => { s = s.replace(re, " "); };
  if (/\bday after tomorrow\b/i.test(s)) { due = at(2); cut(/\bday after tomorrow\b/i); }
  else if (/\btomorrow\b/i.test(s)) { due = at(1); cut(/\btomorrow\b/i); }
  else if (/\b(today|tonight)\b/i.test(s)) { due = at(0); cut(/\b(today|tonight)\b/i); }
  else if ((m = s.match(/\bin (\d+) days?\b/i))) { due = at(+m[1]); cut(/\bin \d+ days?\b/i); }
  else if ((m = s.match(/\b(?:this |next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i))) {
    due = at((DAYS.indexOf(m[1].toLowerCase()) - new Date().getDay() + 7) % 7 || 7);
    cut(/\b(?:this |next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i);
  }
  s = s.replace(/\b(urgent(ly)?|asap|high priority|important)\b/ig, " ").replace(/\s+/g, " ").trim()
    .replace(/\b(due|by|on|before)$/i, "").trim().replace(/^(a|an|the|to)\s+/i, "");
  if (!s) return null;
  const side = FOUNDER_WORDS.test(s) && !STUDENT_WORDS.test(s) ? "founder" : "student";
  const cat = (CAT_WORDS[side].find(([, re]) => re.test(s)) || ["Other"])[0];
  return { type: "add", text: s.charAt(0).toUpperCase() + s.slice(1), side, cat, pri: /urgent|important|high priority|asap/i.test(raw) ? 3 : 2, due };
}
function findPending(query) {
  const words = query.toLowerCase().split(/\W+/).filter(w => w.length > 2);
  let best = null, score = 0;
  items.filter(i => !i.done).forEach(i => {
    const n = words.filter(w => i.text.toLowerCase().includes(w)).length;
    if (n > score) { score = n; best = i; }
  });
  return best;
}
function summary() {
  const pend = items.filter(i => !i.done).sort(sortPending);
  if (!pend.length) return "You're all clear. Nothing pending right now.";
  const over = pend.filter(i => urgency(i) === "over");
  const top = pend.slice(0, 4).map(i => i.text + (i.due ? ", " + dueLabel(i.due).toLowerCase() : "")).join("; ");
  return `You have ${pend.length} pending${over.length ? `, ${over.length} overdue` : ""}. Up next: ${top}.`;
}
function localBrain(t) {
  let m;
  if (/\b(what|show|list|tell|how)\b.*\b(have|pending|todo|to do|left|due|plate|first|doing|balanced)\b/i.test(t)) return { reply: summary(), actions: [] };
  if ((m = t.match(/^(?:mark\s+)?(?:done|finished|completed|complete)\s+(?:with\s+)?(.+)/i)) || (m = t.match(/^i(?: have|'ve)? (?:finished|completed|did|done)\s+(.+)/i))) {
    const it = findPending(m[1]);
    return it ? { reply: `Nice, ${it.text} is done.`, actions: [{ type: "done", id: it.id }] } : { reply: `I couldn't find "${m[1]}" in your list.`, actions: [] };
  }
  if ((m = t.match(/^(?:delete|remove)\s+(.+)/i))) {
    const it = findPending(m[1]);
    return it ? { reply: `Removed ${it.text}.`, actions: [{ type: "delete", id: it.id }] } : { reply: `I couldn't find "${m[1]}".`, actions: [] };
  }
  const a = parseAdd(t);
  return a ? { reply: `Got it: ${a.text}${a.due ? ", " + dueLabel(a.due).toLowerCase() : ""}.`, actions: [a] } : { reply: "Sorry, I didn't catch a task there.", actions: [] };
}

async function askAI(text) {

  if (r.status === 401) { showLock(true); throw new Error("locked"); }
  if (!r.ok) throw new Error("server " + r.status);
  return r.json();
}

let busy = false;
async function runCommand(text) {
  text = text.trim();

  pauseListening();
  chat.push({ role: "user", text, t: Date.now() });
  showCaption("you", "You", text, null, true);

  let res = null;
  if (AI.ok) { try { res = await askAI(text); } catch (e) { res = null; } }
  if (!res) res = localBrain(text);
  const before = JSON.stringify(items);
  const chips = applyActions(res.actions);
  const reply = String(res.reply || (chips.length ? "Done." : "Okay."));
  chat.push({ role: "agent", text: reply, chips, t: Date.now() });
  showTyping(false); update(); renderChat();
  showCaption("reply", "Zia", reply, chips);
  if (chips.length) toast(chips.length === 1 ? chips[0].label : chips.length + " changes made", () => { items = JSON.parse(before); update(); });
  busy = false;
  speak(reply);
}
