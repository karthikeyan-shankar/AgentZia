/* ================= phones: floating glass mic, captions, bottom sheet ================= */
const isMobile = () => window.matchMedia("(max-width: 860px)").matches;
let capTimer = null, capKind = "";
function showCaption(kind, label, text, chips, sticky) { // what you said / what Zia answered, floating above the mic
  if (!isMobile() || document.body.classList.contains("sheet-open")) return;
  const c = $("#caption");
  c.replaceChildren(el("small", null, label), el("div", null, text));
  if (chips && chips.length) { const ch = msgEl({ role: "agent", text: "", chips }).querySelector(".chips"); if (ch) c.append(ch); }
  c.classList.add("on"); capKind = kind;
  clearTimeout(capTimer);
  if (!sticky) capTimer = setTimeout(hideCaption, 10000);
}
function hideCaption() { clearTimeout(capTimer); capKind = ""; $("#caption").classList.remove("on"); }
$("#caption").onclick = e => { if (!e.target.closest(".achip")) openSheet("vAgent"); };

function openSheet(tab) {
  if (tab) switchTab(tab);
  if (document.body.classList.contains("sheet-open")) return;
  document.body.classList.add("sheet-open");
  hideCaption(); renderChat();
  try { history.pushState({ ziaSheet: 1 }, ""); } catch (e) {} // so Android's back button closes the sheet
}
function closeSheet(fromBack) {
  if (!document.body.classList.contains("sheet-open")) return;
  document.body.classList.remove("sheet-open");
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (!fromBack && history.state && history.state.ziaSheet) history.back();
}
window.addEventListener("popstate", () => closeSheet(true));
$("#openSheet").onclick = () => openSheet();
$("#scrim").onclick = () => closeSheet();
$("#fab").onclick = () => session ? endSession() : startSession();
(function sheetSwipes() { // swipe up from the mic area to open, swipe the sheet's top down to close
  let up = null;
  $("#fabWrap").addEventListener("touchstart", e => { up = e.touches[0].clientY; }, { passive: true });
  $("#fabWrap").addEventListener("touchend", e => { if (up !== null && up - e.changedTouches[0].clientY > 50) openSheet(); up = null; });
  const panel = document.querySelector(".panel");
  let sy = null, dy = 0;
  const start = e => { if (!isMobile()) return; sy = e.touches[0].clientY; dy = 0; panel.classList.add("dragging"); };
  const move = e => { if (sy === null) return; dy = Math.max(0, e.touches[0].clientY - sy); panel.style.transform = `translateY(${dy}px)`; };
  const end = () => { if (sy === null) return; panel.classList.remove("dragging"); panel.style.transform = ""; if (dy > 90) closeSheet(); sy = null; };
  [$("#sheetGrab"), document.querySelector(".tabs")].forEach(h => {
    h.addEventListener("touchstart", start, { passive: true });
    h.addEventListener("touchmove", move, { passive: true });
    h.addEventListener("touchend", end);
  });
})();

/* ================= voice ================= */
function setOrb(s) {
  G.orb = s;
  $("#agentState").textContent = { idle: "Ready", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking…" }[s];
  $("#miniOrb").className = "mini-orb " + s;
  const fab = $("#fab");
  fab.classList.toggle("busy", s === "thinking");
  fab.classList.toggle("talk", s === "speaking");
  if (s === "listening") {
    const cap = $("#caption");
    if (capKind === "reply" && cap.classList.contains("on")) cap.querySelector("small").textContent = "Zia · listening"; // keep the reply readable
    else showCaption("listen", "Listening…", "Say what you have, or ask “what's due?”", null, true);
  }
}
let voice = null;
function pickVoice() {
  if (!window.speechSynthesis) return;
  const en = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  voice = en.find(v => /natural/i.test(v.name) && /en-(IN|GB|US)/i.test(v.lang))
    || en.find(v => /Google UK English Female|Google US English/i.test(v.name))
    || en.find(v => /en-IN/i.test(v.lang)) || en[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let ttsActive = false, curUtter = null, ttsGuard = null;
function speak(text) {
  pauseListening();
  if (!settings.voiceOn || !window.speechSynthesis) { afterSpeak(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.rate = 1.03;
  const finish = () => { if (curUtter !== u) return; curUtter = null; clearTimeout(ttsGuard); afterSpeak(); };
  u.onstart = () => { if (curUtter === u) setOrb("speaking"); };
  u.onboundary = () => { G.level = 1; };
  u.onend = u.onerror = finish;
  curUtter = u; ttsActive = true;
  clearTimeout(ttsGuard);
  ttsGuard = setTimeout(finish, 4000 + text.length * 90); // some browsers never fire onend
  speechSynthesis.speak(u);
}
function afterSpeak() {
  ttsActive = false;
  if (session) setTimeout(resumeListening, 300); else setOrb("idle");
}

/* Mic session: once on, Zia keeps listening and answers each thing you say,
   pausing only while it thinks/speaks (so it never hears itself), until you turn the mic off. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, session = false, recActive = false, heard = "", flushTimer = null, restarts = [];
function setMicUI() {
  [$("#mic"), $("#fab")].forEach(m => {
    m.classList.toggle("on", session);
    m.title = session ? "Mic is on. Tap to turn it off" : "Turn the mic on";
    m.setAttribute("aria-label", m.title);
    m.setAttribute("aria-pressed", String(session));
  });
  if (!session && capKind === "listen") hideCaption();
}
function startSession() {
  if (!SR) { toast("Voice needs Chrome or Edge. You can still type."); return; }
  session = true; restarts = []; setMicUI(); switchTab("vAgent");
  if (window.speechSynthesis) speechSynthesis.cancel();
  ttsActive = false;
  resumeListening();
}
function endSession() {
  session = false; setMicUI();
  clearTimeout(flushTimer); heard = "";
  pauseListening();
  if (interimText) { interimText = ""; renderChat(); }
  if (G.orb === "listening") setOrb("idle");
}
function pauseListening() {
  if (rec && recActive) { try { rec.abort(); } catch (e) {} }
  recActive = false;
}
function resumeListening() {
  if (!session || recActive || busy || ttsActive) return;
  const now = Date.now();
  restarts = restarts.filter(t => now - t < 6000); restarts.push(now);
  if (restarts.length > 8) { toast("The mic keeps cutting out, so I turned it off. Tap the mic to try again."); endSession(); return; }
  const r = new SR(); rec = r;
  r.lang = "en-IN"; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    if (rec !== r) return;
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) heard += " " + e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    showInterim((heard + " " + interim).trim());
    clearTimeout(flushTimer);
    // wait for a short pause so a sentence said in parts is handled as one request
    if (heard.trim()) flushTimer = setTimeout(flush, interim ? 1600 : 900);
  };
  r.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { toast("Microphone is blocked. Allow it in the address bar."); endSession(); }
    else if (e.error === "network") { toast("Voice needs an internet connection."); endSession(); }
  };
  r.onend = () => {
    if (rec !== r) return;
    recActive = false;
    if (session && !busy && !ttsActive) setTimeout(resumeListening, 250); // browsers stop after silence; quietly restart
  };
  try { r.start(); recActive = true; setOrb("listening"); } catch (e) { recActive = false; }
}
function flush() {
  const said = heard.trim();
  heard = ""; interimText = "";
  if (said) runCommand(said);
}
$("#mic").onclick = () => session ? endSession() : startSession();

function syncToggles() {
  $("#tgVoice").classList.toggle("on", settings.voiceOn);
  store.set("krefter_settings", settings);
}
$("#tgVoice").onclick = () => { settings.voiceOn = !settings.voiceOn; if (!settings.voiceOn && window.speechSynthesis) speechSynthesis.cancel(); syncToggles(); };

/* ================= misc UI ================= */
function switchTab(id) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === id));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => switchTab(t.dataset.view));
function toast(text, undo) {
  const t = el("div", "toast");
  t.append(el("span", null, text));
  if (undo) { const b = el("button", null, "Undo"); b.onclick = () => { undo(); t.remove(); }; t.append(b); }
  $("#toasts").append(t);
  setTimeout(() => t.remove(), 5000);
}
const ACCENTS = [
  ["Teal", "#0d9488"], ["Indigo", "#5b5bd6"], ["Emerald", "#15925e"],
  ["Rose", "#d6336c"], ["Violet", "#7c4ddb"], ["Graphite", "#3f3f46"]
];
function applyAccent(hex) {
  const n = parseInt(hex.slice(1), 16);
  document.documentElement.style.setProperty("--accent", hex);
  document.documentElement.style.setProperty("--accent-soft", `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},.18)`);
  readColors();
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  readColors();
}
function renderThemeMenu() {
  const m = $("#themeMenu"); m.replaceChildren();
  m.append(el("h6", null, "Appearance"));
  const swatch = { light: "#ffffff", dim: "#e3e6ea", graphene: "#2c2f35", dark: "#121214", system: "linear-gradient(135deg,#ffffff 50%,#121214 50%)" };
  [["light", "Light"], ["dim", "Light dim"], ["graphene", "Graphene"], ["dark", "Dark"], ["system", "Match system"]].forEach(([v, name]) => {
    const b = el("button", settings.theme === v ? "on" : ""), ic = el("i");
    ic.style.background = swatch[v];
    ic.style.boxShadow = "inset 0 0 0 1px rgba(0,0,0,.25)";
    b.setAttribute("role", "menuitem"); b.append(ic, el("span", null, name));
    b.onclick = e => { e.stopPropagation(); settings.theme = v; store.set("krefter_settings", settings); applyTheme(v); renderThemeMenu(); };
    m.append(b);
  });
  m.append(el("hr"), el("h6", null, "Accent colour"));
  ACCENTS.forEach(([name, hex]) => {
    const b = el("button", settings.accent === hex ? "on" : ""), dot = el("i");
    dot.style.background = hex; b.setAttribute("role", "menuitem");
    b.append(dot, el("span", null, name));
    b.onclick = () => { settings.accent = hex; store.set("krefter_settings", settings); applyAccent(hex); renderThemeMenu(); m.classList.remove("on"); };
    m.append(b);
  });
}
$("#btnTheme").onclick = e => { e.stopPropagation(); renderThemeMenu(); $("#themeMenu").classList.toggle("on"); };
document.addEventListener("click", e => { if (!e.target.closest(".theme-wrap")) $("#themeMenu").classList.remove("on"); });
function setPill(on, text) { const p = $("#aiPill"); p.textContent = text; p.classList.toggle("on", on); }

$("#btnExport").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ items, chat, images }, null, 2)], { type: "application/json" }));
  a.download = "zia-backup-" + localISO(new Date()) + ".json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("#btnImport").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  f.text().then(t => {
    try {
      const d = JSON.parse(t), list = Array.isArray(d) ? d : d.items;
      if (!Array.isArray(list)) throw 0;
      items = list.filter(i => i && i.id && i.text).map(i => Object.assign({ side: "student", cat: "Other", pri: 2, due: "", done: false, doneAt: null }, i));
      if (!Array.isArray(d) && Array.isArray(d.chat)) chat = d.chat;
      if (!Array.isArray(d) && Array.isArray(d.images)) images = d.images.filter(i => i && i.id && i.src);
      G.first = true; update(); renderChat(); toast("Imported " + items.length + " tasks");
    } catch (err) { toast("That file isn't a Zia backup."); }
  });
};

document.addEventListener("keydown", e => {
  const typingInField = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "");
  if (e.key === "Escape") { closeEditor(); $("#viewer").classList.remove("on"); G.sel = null; G.selImg = null; hideCard(); if (ttsActive && window.speechSynthesis) speechSynthesis.cancel(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && G.selImg && !typingInField) { e.preventDefault(); removeImage(G.selImg); return; }
  if (typingInField || $("#modal").classList.contains("on") || $("#lock").classList.contains("on") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); session ? endSession() : startSession(); }
  else if (e.key === "/") { e.preventDefault(); switchTab("vAgent"); $("#askText").focus(); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); openEditor(null); }
  else if (e.key === "f" || e.key === "F") { G.userCam = false; fit(false); }
  else if (e.key === "c" || e.key === "C") switchTab("vCal");
});
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", readColors);

/* ================= lock + boot ================= */
function showLock(wrong) {
  $("#lock").classList.add("on");
  $("#lockErr").textContent = wrong ? "That passcode didn't work." : "";
  setTimeout(() => $("#lockKey").focus(), 30);
}
$("#lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  passKey = $("#lockKey").value; store.set("krefter_key", passKey);
  $("#lock").classList.remove("on");
  await loadServer();
});
async function loadServer() {
  try {
    const r = await api("/api/items");
    if (r.status === 401) { passKey = ""; store.set("krefter_key", ""); showLock(true); return; }
    const d = await r.json();
    if (Array.isArray(d.items) && (d.items.length || !items.length)) {
      items = d.items; chat = Array.isArray(d.chat) ? d.chat : [];
    }
    if (Array.isArray(d.images) && (d.images.length || !images.length)) images = d.images;
    serverReady = true;
    setPill(AI.ok, AI.ok ? "AI on" : "AI off");
    G.first = true; update(); renderChat();
  } catch (e) { setPill(false, "Offline"); }
}
async function boot() {
  readColors(); if (settings.accent) applyAccent(settings.accent); syncToggles(); setOrb("idle");
  new ResizeObserver(resize).observe(canvas);
  resize(); build(); renderStats(); renderTasks(); renderCal(); renderChat();
  requestAnimationFrame(frame);
  if (!SERVER) { setPill(false, "Offline mode"); return; }
  try {
    const h = await (await fetch("/api/health")).json();
    AI.ok = !!h.ai;
    if (h.locked && !passKey) { showLock(false); return; }
    await loadServer();
  } catch (e) { setPill(false, "Server offline"); }
}
boot();
</script>
